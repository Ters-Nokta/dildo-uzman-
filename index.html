<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Midnight Garden</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="not-loaded">

    <main class="scene">

        <!-- GECE -->
        <div class="night"></div>

        <!-- AY -->
        <div class="moon">
            <div class="moon-crater crater-1"></div>
            <div class="moon-crater crater-2"></div>
            <div class="moon-crater crater-3"></div>
        </div>

        <!-- AURORA -->
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>

        <!-- YILDIZLAR -->
        <div class="stars"></div>

        <!-- UZAK ÇİMENLER -->
        <div class="background-grass">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span>
            <span></span><span></span>
            <span></span><span></span>
        </div>


        <!-- =========================
             ÇİÇEK BAHÇESİ
        ========================== -->

        <section class="garden">

            <!-- ARKA ÇİÇEK -->
            <div class="flower flower-small flower-back-left">

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>

                <div class="bloom">
                    <i class="petal p1"></i>
                    <i class="petal p2"></i>
                    <i class="petal p3"></i>
                    <i class="petal p4"></i>
                    <i class="petal p5"></i>
                    <i class="petal p6"></i>

                    <div class="flower-core"></div>
                </div>

            </div>


            <!-- ARKA SAĞ ÇİÇEK -->
            <div class="flower flower-small flower-back-right">

                <div class="stem"></div>

                <div class="leaf leaf-right"></div>

                <div class="bloom">
                    <i class="petal p1"></i>
                    <i class="petal p2"></i>
                    <i class="petal p3"></i>
                    <i class="petal p4"></i>
                    <i class="petal p5"></i>
                    <i class="petal p6"></i>

                    <div class="flower-core"></div>
                </div>

            </div>


            <!-- ANA ÇİÇEK -->
            <div class="flower flower-main">

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>

                <div class="bloom">

                    <!-- DIŞ YAPRAKLAR -->

                    <i class="petal p1"></i>
                    <i class="petal p2"></i>
                    <i class="petal p3"></i>
                    <i class="petal p4"></i>
                    <i class="petal p5"></i>
                    <i class="petal p6"></i>
                    <i class="petal p7"></i>
                    <i class="petal p8"></i>

                    <!-- İÇ YAPRAKLAR -->

                    <i class="inner-petal ip1"></i>
                    <i class="inner-petal ip2"></i>
                    <i class="inner-petal ip3"></i>
                    <i class="inner-petal ip4"></i>
                    <i class="inner-petal ip5"></i>

                    <!-- MERKEZ -->

                    <div class="flower-core">
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- ÖN SOL ÇİÇEK -->
            <div class="flower flower-front-left">

                <div class="stem"></div>

                <div class="leaf leaf-left"></div>

                <div class="bloom">

                    <i class="petal p1"></i>
                    <i class="petal p2"></i>
                    <i class="petal p3"></i>
                    <i class="petal p4"></i>
                    <i class="petal p5"></i>
                    <i class="petal p6"></i>

                    <div class="flower-core"></div>

                </div>

            </div>


            <!-- ÖN SAĞ ÇİÇEK -->
            <div class="flower flower-front-right">

                <div class="stem"></div>

                <div class="leaf leaf-right"></div>

                <div class="bloom">

                    <i class="petal p1"></i>
                    <i class="petal p2"></i>
                    <i class="petal p3"></i>
                    <i class="petal p4"></i>
                    <i class="petal p5"></i>
                    <i class="petal p6"></i>

                    <div class="flower-core"></div>

                </div>

            </div>


            <!-- ÇİMENLER -->

            <div class="grass-clump grass-1"></div>
            <div class="grass-clump grass-2"></div>
            <div class="grass-clump grass-3"></div>
            <div class="grass-clump grass-4"></div>
            <div class="grass-clump grass-5"></div>
            <div class="grass-clump grass-6"></div>


            <!-- ATEŞ BÖCEKLERİ -->

            <div class="firefly f1"></div>
            <div class="firefly f2"></div>
            <div class="firefly f3"></div>
            <div class="firefly f4"></div>
            <div class="firefly f5"></div>
            <div class="firefly f6"></div>
            <div class="firefly f7"></div>
            <div class="firefly f8"></div>

        </section>


        <!-- ÖN PLAN -->
        <div class="foreground"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
