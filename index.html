<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Bloom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="scene">

    <!-- Gökyüzü -->
    <div class="sky"></div>

    <!-- Ay -->
    <div class="moon"></div>

    <!-- Uzak ışık -->
    <div class="ambient-light"></div>

    <!-- Küçük ateş böcekleri -->
    <div class="firefly firefly-1"></div>
    <div class="firefly firefly-2"></div>
    <div class="firefly firefly-3"></div>
    <div class="firefly firefly-4"></div>
    <div class="firefly firefly-5"></div>
    <div class="firefly firefly-6"></div>

    <!-- Zemin -->
    <div class="ground"></div>

    <!-- Çimenler -->
    <div class="grass"></div>

    <!-- ÇİÇEK -->
    <div class="flower">

        <!-- Gövde -->
        <div class="stem"></div>

        <!-- Yapraklar -->
        <div class="leaf leaf-left">
            <span></span>
        </div>

        <div class="leaf leaf-right">
            <span></span>
        </div>

        <!-- Çiçek başı -->
        <div class="flower-head">

            <!-- Dış yapraklar -->
            <div class="petal outer p1"></div>
            <div class="petal outer p2"></div>
            <div class="petal outer p3"></div>
            <div class="petal outer p4"></div>
            <div class="petal outer p5"></div>
            <div class="petal outer p6"></div>
            <div class="petal outer p7"></div>
            <div class="petal outer p8"></div>

            <!-- Orta yapraklar -->
            <div class="petal middle m1"></div>
            <div class="petal middle m2"></div>
            <div class="petal middle m3"></div>
            <div class="petal middle m4"></div>
            <div class="petal middle m5"></div>
            <div class="petal middle m6"></div>

            <!-- İç yapraklar -->
            <div class="inner-petal i1"></div>
            <div class="inner-petal i2"></div>
            <div class="inner-petal i3"></div>
            <div class="inner-petal i4"></div>

            <!-- Çiçeğin merkezi -->
            <div class="flower-center">
                <div class="center-light"></div>
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
